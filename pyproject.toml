[project]
name = "portfolio-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.1.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["main.py", "portfolio_mcp", "tests"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["."]
